name: TiltHexa long paper campaign

on:
  push:
    branches:
      - pr_unifympc_wls_20260918_apm47
    paths:
      - 'libraries/AP_TiltHexa/**'
      - 'Tools/tilt_hexa_30kg/**'
      - '.github/workflows/tilt_hexa_campaign.yml'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign to run: all/e0/e1/e2/e3/e4/e5/smoke'
        required: true
        default: all
        type: choice
        options: [all, smoke, e0, e1, e2, e3, e4, e5]
      monte_carlo_runs:
        description: 'E5 Monte Carlo runs per allocator'
        required: true
        default: '50'

concurrency:
  group: tilt-hexa-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-campaign:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --user 1001
    timeout-minutes: 360
    env:
      CAMPAIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign || 'all' }}
      MC_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.monte_carlo_runs || '50' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare environment
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          python3 -m pip install --user -q pytest pyyaml numpy scipy pandas matplotlib pymavlink
          echo "/github/home/.local/bin" >> "${GITHUB_PATH}"

      - name: Build research core and ArduPlane SITL
        shell: 'script -q -e -c "bash {0}"'
        run: |
          PATH="/github/home/.local/bin:$PATH"
          make -C libraries/AP_TiltHexa/core all
          ./waf configure --board sitl
          ./waf plane

      - name: Run selected campaign
        id: campaign
        shell: bash
        run: |
          set +e
          status=0
          failure_file="Tools/tilt_hexa_30kg/results/ci/campaign_failures.txt"
          mkdir -p "$(dirname "$failure_file")"
          : > "$failure_file"
          run_case() {
            echo "::group::$1"
            shift
            timeout --signal=TERM 90m "$@"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "FAILED: $* (rc=$rc)" | tee -a "$failure_file" >&2
              status=1
            fi
          }

          case "$CAMPAIGN" in
            smoke)
              run_case "SITL hover PI" python3 Tools/tilt_hexa_30kg/experiments/smoke_sitl.py --alloc pi --mission hover --alt 5 --duration 40 --instance 0 --name ci_hover_pi
              run_case "SITL hover WLS" python3 Tools/tilt_hexa_30kg/experiments/smoke_sitl.py --alloc wls --mission hover --alt 5 --duration 40 --instance 1 --name ci_hover_wls
              run_case "SITL transition PI" python3 Tools/tilt_hexa_30kg/experiments/smoke_sitl.py --alloc pi --mission transition --alt 60 --cruise 20 --duration 130 --instance 2 --name ci_transition_pi
              run_case "SITL transition WLS" python3 Tools/tilt_hexa_30kg/experiments/smoke_sitl.py --alloc wls --mission transition --alt 60 --cruise 20 --duration 130 --instance 3 --name ci_transition_wls
              ;;
            e0)
              run_case E0 python3 Tools/tilt_hexa_30kg/experiments/run_e0_boundaries.py
              ;;
            e1)
              run_case E1 python3 Tools/tilt_hexa_30kg/experiments/run_e1_trim.py
              run_case AFMS python3 Tools/tilt_hexa_30kg/analysis/run_afms.py
              ;;
            e2)
              run_case E2 python3 Tools/tilt_hexa_30kg/experiments/run_e2_transition.py
              ;;
            e3)
              run_case E3 python3 Tools/tilt_hexa_30kg/experiments/run_e3_stress.py
              ;;
            e4)
              run_case E4 python3 Tools/tilt_hexa_30kg/experiments/run_e4_mission.py
              ;;
            e5)
              run_case E5 python3 Tools/tilt_hexa_30kg/experiments/run_e5_robustness.py --mc-n "$MC_RUNS"
              ;;
            all)
              run_case E0 python3 Tools/tilt_hexa_30kg/experiments/run_e0_boundaries.py
              run_case E1 python3 Tools/tilt_hexa_30kg/experiments/run_e1_trim.py
              run_case AFMS python3 Tools/tilt_hexa_30kg/analysis/run_afms.py
              run_case E2 python3 Tools/tilt_hexa_30kg/experiments/run_e2_transition.py
              run_case E3 python3 Tools/tilt_hexa_30kg/experiments/run_e3_stress.py
              run_case E4 python3 Tools/tilt_hexa_30kg/experiments/run_e4_mission.py
              run_case E5 python3 Tools/tilt_hexa_30kg/experiments/run_e5_robustness.py --mc-n "$MC_RUNS"
              ;;
            *)
              echo "Unknown campaign: $CAMPAIGN" >&2
              status=2
              ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Write campaign manifest
        if: always()
        run: |
          mkdir -p Tools/tilt_hexa_30kg/results/ci
          {
            echo "commit=${GITHUB_SHA}"
            echo "campaign=${CAMPAIGN}"
            echo "mc_runs=${MC_RUNS}"
            echo "utc=$(date -u +%FT%TZ)"
            echo "seed_status=REFERENCE_SEED_NOT_MEASURED"
          } > Tools/tilt_hexa_30kg/results/ci/campaign_manifest.txt

      - name: Stage compact paper summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage="${GITHUB_WORKSPACE}/.paper_summaries"
          root="Tools/tilt_hexa_30kg/results"
          rm -rf "$stage"
          mkdir -p "$stage"
          : > "$stage/excluded_large_or_raw_files.txt"

          if [ -d "$root" ]; then
            while IFS= read -r -d '' f; do
              rel="${f#${root}/}"
              base="$(basename "$f")"
              size="$(stat -c '%s' "$f")"
              case "$base" in
                *truth*.csv|*timehistory*.csv|*time_history*.csv|*timeseries*.csv|*time_series*.csv)
                  printf '%s %s raw-timeseries\n' "$size" "$rel" >> "$stage/excluded_large_or_raw_files.txt"
                  continue
                  ;;
              esac
              if [ "$size" -gt 10485760 ]; then
                printf '%s %s over-10MiB\n' "$size" "$rel" >> "$stage/excluded_large_or_raw_files.txt"
                continue
              fi
              mkdir -p "$stage/$(dirname "$rel")"
              cp "$f" "$stage/$rel"
            done < <(
              find "$root" -type f \( \
                -name '*.csv' -o -name '*.json' -o -name '*.txt' -o -name '*.md' -o \
                -name '*.png' -o -name '*.pdf' -o -name '*.svg' -o -name '*.tex' -o \
                -name '*.yaml' -o -name '*.yml' \
              \) -print0
            )
          fi

          find "$stage" -type f -printf '%s %P\n' | sort -n > "$stage/compact_manifest.txt"
          du -sh "$stage"

      - name: Upload compact paper summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tilt-hexa-paper-summaries-${{ env.CAMPAIGN }}-${{ github.run_id }}
          path: .paper_summaries/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload campaign results and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tilt-hexa-${{ env.CAMPAIGN }}-${{ github.run_id }}
          path: |
            Tools/tilt_hexa_30kg/results/**
            logs/**
            *.BIN
            **/*.BIN
          if-no-files-found: warn
          retention-days: 30
